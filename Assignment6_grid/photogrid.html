<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Photo Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:30px;font-family:Arial;text-align:center;background:#f1f5f9}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
figure{margin:0;overflow:hidden;background:white;border-radius:10px}
img{display:block;width:100%;height:220px;object-fit:cover;transition:transform .5s ease}
figure:hover img{transform:scale(1.08)}
figcaption{padding:12px;font-weight:bold}
</style></head>
<body><h1>Photo Gallery</h1><main class="gallery">
<figure><img src="https://picsum.photos/500/350?random=1" alt="Nature"><figcaption>Nature</figcaption></figure>
<figure><img src="https://picsum.photos/500/350?random=2" alt="Mountain"><figcaption>Mountain</figcaption></figure>
<figure><img src="https://picsum.photos/500/350?random=3" alt="City"><figcaption>City</figcaption></figure>
<figure><img src="https://picsum.photos/500/350?random=4" alt="Travel"><figcaption>Travel</figcaption></figure>
<figure><img src="https://picsum.photos/500/350?random=5" alt="Forest"><figcaption>Forest</figcaption></figure>
<figure><img src="https://picsum.photos/500/350?random=6" alt="Beach"><figcaption>Beach</figcaption></figure>
</main></body></html>
