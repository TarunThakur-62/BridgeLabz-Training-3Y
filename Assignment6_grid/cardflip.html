<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Card Flip</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;background:#e2e8f0}.scene{width:320px;height:380px;perspective:1000px}
.card{width:100%;height:100%;position:relative;transition:transform .8s;transform-style:preserve-3d}.scene:hover .card{transform:rotateY(180deg)}
.side{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:15px;padding:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:white;box-shadow:0 5px 15px #999}.front img{width:100%;border-radius:10px}.back{transform:rotateY(180deg);background:#dbeafe}
</style></head>
<body><div class="scene"><div class="card"><div class="side front"><h1>Cybersecurity</h1><img src="https://picsum.photos/300/180?random=10" alt="Cybersecurity"></div><div class="side back"><h2>About</h2><p>Cybersecurity protects computers, networks and data from cyber threats.</p></div></div></div></body></html>
