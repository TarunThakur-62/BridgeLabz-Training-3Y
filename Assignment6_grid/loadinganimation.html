<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Loading Animation</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111827}
.loader{display:flex;align-items:center;gap:12px}
.circle{width:18px;height:18px;border-radius:50%;background:#38bdf8;animation:bounce .8s infinite alternate}
.two{animation-delay:.2s}.three{animation-delay:.4s}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-25px)}}
</style></head>
<body><div class="loader">
    <div class="circle"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>
</div>
</body></html>
