<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Homepage</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:Arial}
header{background:#1e3a8a;color:white;padding:20px}
nav{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px}
nav a{color:white;text-decoration:none}
main{flex:1;display:flex;align-items:center;justify-content:center;gap:25px;padding:30px}
.box{flex:1;min-height:180px;padding:30px;text-align:center;background:#dbeafe;border-radius:12px;transition:transform .3s}
.box:hover{transform:rotate(2deg)}
footer{width:100%;text-align:center;padding:15px;background:#e5e7eb}@media(max-width:700px){main{flex-direction:column}.box{width:100%}}
</style></head>
<body><header><h1>My Website</h1><nav><a href="#">Home</a><a href="#">About</a><a href="#">Services</a><a href="#">Contact</a></nav></header>
<main><div class="box"><h2>Services</h2><p>Web design and development.</p></div><div class="box"><h2>Projects</h2><p>Creative student projects.</p></div><div class="box"><h2>Contact</h2><p>Email us for more information.</p></div></main>
<footer>&copy; 2026 My Website</footer></body></html>
